name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed files
    runs-on: windows-2022
    outputs:
      gradle_required: ${{ steps.filter.outputs.gradle_required }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - name: Decide whether Gradle checks are required
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: .\scripts\classify-ci-changes.ps1

  tests:
    name: Tests
    needs: changes
    if: needs.changes.outputs.gradle_required == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run tests
        run: .\gradlew.bat test

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.gradle_required == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Check Kotlin formatting
        run: .\gradlew.bat ktlintCheck

  wrapper-validation:
    name: Gradle Wrapper Validation
    needs: changes
    if: needs.changes.outputs.gradle_required == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  package-manual:
    name: Manual Windows package
    if: github.event_name == 'workflow_dispatch'
    needs: [changes, tests, lint, wrapper-validation]
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build Windows app-image
        run: .\gradlew.bat packageWindows
      - name: Smoke-test packaged executable
        shell: pwsh
        run: .\scripts\smoke-windows-package.ps1 -AppImagePath .\build\windows\PromptGenerator
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $zip = Resolve-Path .\build\windows\PromptGenerator-windows-x64.zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $(Split-Path $zip -Leaf)`n", [Text.Encoding]::ASCII)
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PromptGenerator-windows-x64
          path: |
            build/windows/PromptGenerator-windows-x64.zip
            build/windows/PromptGenerator-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  ci-summary:
    name: CI summary
    if: always()
    needs: [changes, tests, lint, wrapper-validation, dependency-review, package-manual]
    runs-on: windows-2022
    steps:
      - name: Require all applicable checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          GRADLE_REQUIRED: ${{ needs.changes.outputs.gradle_required }}
          TESTS_RESULT: ${{ needs.tests.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          WRAPPER_RESULT: ${{ needs.wrapper-validation.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          PACKAGE_RESULT: ${{ needs.package-manual.result }}
        shell: pwsh
        run: |
          if ($env:CHANGES_RESULT -ne "success") { throw "Changed-path classification result: $env:CHANGES_RESULT" }
          if ($env:GRADLE_REQUIRED -eq "true") {
            if ($env:TESTS_RESULT -ne "success") { throw "Tests result: $env:TESTS_RESULT" }
            if ($env:LINT_RESULT -ne "success") { throw "Lint result: $env:LINT_RESULT" }
            if ($env:WRAPPER_RESULT -ne "success") { throw "Wrapper validation result: $env:WRAPPER_RESULT" }
          }
          if ($env:EVENT_NAME -eq "pull_request" -and $env:DEPENDENCY_RESULT -ne "success") {
            throw "Dependency review result: $env:DEPENDENCY_RESULT"
          }
          if ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:PACKAGE_RESULT -ne "success") {
            throw "Manual package result: $env:PACKAGE_RESULT"
          }
          Write-Output "All required checks passed for $env:EVENT_NAME."
